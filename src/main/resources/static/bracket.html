<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Bracket</title>
    <link rel="stylesheet" href="styles/bracket.css">
</head>
<body>
    <main class="bracket-page">
        <h1>Tournament Bracket</h1>
        <div class="tournament-bracket" aria-label="Tournament bracket">

            <section class="round">
                <h2>Start</h2>
                <div class="matches" id="start">
                </div>
            </section>

            <section class="round">
                <h2>Quarter-finals</h2>
                <div class="matches" id="quarter-finals">
                </div>
            </section>

            <section class="round">
                <h2>Semi-finals</h2>
                <div class="matches">
                    <article class="match">
                        <div class="player">Player 1</div>
                        <div class="player">Player 2</div>
                    </article>
                    <article class="match">
                        <div class="player">Player 3</div>
                        <div class="player">Player 4</div>
                    </article>
                </div>
            </section>

            <section class="round">
                <h2>Final</h2>
                <div class="matches">
                    <article class="match">
                        <div class="player">Player 5</div>
                        <div class="player">Player 6</div>
                    </article>
                </div>
            </section>
        </div>
    </main>
    <script  defer src="scripts/bracket.js"></script>
</body>
</html>
