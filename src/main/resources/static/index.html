<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Player Rankings</title>
	<link rel="stylesheet" href="styles/table.css">
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
	<main class="container">
		<h1 class="page-title">ROBOCODE</h1>
		<h2 class="subtitle">LEADERBOARD</h2>
		<table class="demo-table" id="leaderboard">
			<thead>
				<tr>
					<th>Placement</th>
					<th>Player</th>
					<th>Robot</th>
					<th>Score</th>
					<th>Firsts</th>
				</tr>
			</thead>
			<tbody id="player-ids">
			</tbody>
		</table>
		<section id="round-results" hidden>

    <h2 class="results-title">ROUND COMPLETE!</h2>

    <h3 id="round-name"></h3>
	<p class="podium-label">Winners</p>

    <div class="podium">

        <div class="winner">
            <h3 id="second-name"></h3>
            <p id="second-score"></p>
            <div class="podium-block second">2</div>
        </div>

        <div class="winner">
            <span>slay</span>
            <h3 id="first-name"></h3>
            <p id="first-score"></p>
            <div class="podium-block first">1</div>
        </div>

        <div class="winner">
            <h3 id="third-name"></h3>
            <p id="third-score"></p>
            <div class="podium-block third">3</div>
        </div>

    </div>

    <p>Waiting for next round...</p>

</section>
	</main>
    
	<script defer src="scripts/ranking.js"></script>
	<script defer src="scripts/podium.js"></script>
	<script defer src="scripts/recieve-events.js"></script>
	
</body>
</html>
